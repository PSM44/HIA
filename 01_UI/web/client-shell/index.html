<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111923">
  <meta name="description" content="HIA Client Demo Shell">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./assets/app.css">
  <title>HIA — Portfolio Client Shell</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">H</div>
        <div>
          <div class="brand-title">HIA</div>
          <div class="brand-subtitle">Portfolio Client Shell</div>
        </div>
      </div>

      <nav class="nav" aria-label="Navegación principal">
        <button class="nav-item is-active" data-route="client-summary">Resumen para Cliente</button>
        <button class="nav-item" data-route="portfolio">Portfolio HIA</button>
        <button class="nav-item" data-route="active-project">Proyecto activo seleccionado</button>
        <button class="nav-item" data-route="ai-cockpit">AI Cockpit</button>
        <button class="nav-item" data-route="ai-chat">Chat IA</button>
        <button class="nav-item" data-route="ai-selector">Selector IA</button>
        <button class="nav-item" data-route="cost-control">Costos / Tokens</button>
        <button class="nav-item" data-route="context-panel">Contexto activo</button>
        <button class="nav-item" data-route="guided-demo">Demo guiada</button>
        <button class="nav-item" data-route="real-status">Estado real</button>
        <button class="nav-item" data-route="evidence">Evidencia</button>
        <button class="nav-item" data-route="reports">Reportes</button>
        <button class="nav-item" data-route="collaboration">Colaboración</button>
        <button class="nav-item" data-route="integrations">Integraciones</button>
        <button class="nav-item" data-route="tech-debt">Deuda técnica</button>
        <button class="nav-item" data-route="support">Comandos / Soporte</button>
      </nav>

      <div class="sidebar-footer">
        <div class="mini-label">Arquitectura</div>
        <div class="mini-copy">Portfolio + AI Operating Layer · PWA-ready · migrable</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">PRJ_0001_HIA.PRODUCT</div>
          <h1 id="view-title">Resumen para Cliente</h1>
          <p id="view-subtitle">Vista portfolio navegable para entender HIA, sus proyectos y su estado operativo.</p>
        </div>
        <div class="status-chip" id="shell-status">Demo shell v0.1</div>
      </header>

      <section id="view-root" class="view-root" aria-live="polite"></section>
    </main>
  </div>

  <script src="./assets/hia.state.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
