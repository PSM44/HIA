<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f141b">
  <meta name="description" content="HIA Control Tower Shell">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./assets/app.css">
  <title>HIA — Control Tower</title>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">H</div>
        <div>
          <div class="brand-title">HIA</div>
          <div class="brand-subtitle">Control Tower</div>
        </div>
      </div>

      <div class="nav-group">
        <div class="nav-heading">Global</div>
        <button class="nav-item is-active" data-route="control-tower">Control Tower</button>
        <button class="nav-item" data-route="portfolio">Portfolio</button>
        <button class="nav-item" data-route="ai-control">AI Control Tower</button>
        <button class="nav-item" data-route="cost-center">Cost Center</button>
      </div>

      <div class="nav-group">
        <div class="nav-heading">Project Workspace</div>
        <button class="nav-item" data-route="project-overview">Project Overview</button>
        <button class="nav-item" data-route="project-ai">Project AI</button>
        <button class="nav-item" data-route="project-chat">Project Chat</button>
        <button class="nav-item" data-route="project-costs">Project Costs</button>
        <button class="nav-item" data-route="project-evidence">Project Evidence</button>
        <button class="nav-item" data-route="project-settings">Project Settings</button>
      </div>

      <div class="nav-group">
        <div class="nav-heading">Enterprise</div>
        <button class="nav-item" data-route="reports">Reports</button>
        <button class="nav-item" data-route="collaboration">Collaboration</button>
        <button class="nav-item" data-route="integrations">Integrations</button>
        <button class="nav-item" data-route="knowledge-vault">Knowledge / Vault</button>
        <button class="nav-item" data-route="admin-settings">Admin / Settings</button>
      </div>

      <div class="sidebar-footer">
        <div class="mini-label">Selected project</div>
        <div class="mini-copy" id="sidebar-project">PRJ_0001_HIA.PRODUCT</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow" id="view-layer">HIA GLOBAL</div>
          <h1 id="view-title">Control Tower</h1>
          <p id="view-subtitle">Vista global de HIA: portfolio, IAs, costos, alertas y continuidad.</p>
        </div>
        <div class="top-actions">
          <button class="secondary-btn" id="continue-last-project">Continue last project</button>
          <span class="status-chip">PWA-ready · no build</span>
        </div>
      </header>

      <section id="view-root" class="view-root" aria-live="polite"></section>
    </main>
  </div>

  <script src="../client-shell/assets/hia.state.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
